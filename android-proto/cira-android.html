<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CIRA · 安卓原型</title>
<style>
  :root{
    --ink:#f6e9dc;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05030a;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;
    color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;}
  #nebula{position:fixed;inset:0;width:100%;height:100%;display:block;}

  /* 顶部状态条 */
  #statebar{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;
    display:flex;justify-content:center;padding:14px 0 6px;z-index:5;pointer-events:none;}
  #stateText{font-size:13px;letter-spacing:3px;opacity:.6;
    text-shadow:0 0 14px rgba(255,160,90,.5);}

  /* 底部按住说话 */
  #talkWrap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0) + 26px);
    display:flex;flex-direction:column;align-items:center;gap:10px;z-index:6;}
  #talkBtn{width:96px;height:96px;border-radius:50%;border:none;
    background:radial-gradient(circle at 35% 30%,#4a2a18,#1a0e08);
    box-shadow:0 0 0 2px rgba(255,170,100,.35),0 8px 30px rgba(0,0,0,.55),
      inset 0 0 24px rgba(255,160,90,.25);
    color:var(--ink);font-size:14px;letter-spacing:2px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease, box-shadow .2s ease;will-change:transform;}
  #talkBtn:active{transform:scale(.9);
    box-shadow:0 0 0 6px rgba(255,170,100,.5),0 0 40px rgba(255,170,100,.5),
      inset 0 0 30px rgba(255,170,100,.5);}
  #talkBtn.listening{animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(255,170,100,.4),0 0 26px rgba(255,170,100,.3);}
    50%{box-shadow:0 0 0 8px rgba(255,170,100,.55),0 0 48px rgba(255,170,100,.6);}}
  #talkHint{font-size:12px;opacity:.45;letter-spacing:1px;}

  /* 模拟唤醒 FAB（开发用，真机由唤醒词触发） */
  #wakeFab{position:fixed;top:calc(env(safe-area-inset-top,0) + 12px);right:14px;
    z-index:7;width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,200,160,.2);
    background:rgba(30,18,10,.6);color:var(--ink);font-size:11px;line-height:1.2;
    backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;}
  #wakeFab:active{background:rgba(60,36,20,.8);}

  /* 场景B：底部半透明悬浮生命体 */
  #wakePanel{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);
    bottom:calc(env(safe-area-inset-bottom,0) + 18px);
    width:min(86vw,420px);height:148px;border-radius:30px;z-index:8;
    background:linear-gradient(180deg,rgba(40,24,16,.42),rgba(12,7,5,.6));
    border:1px solid rgba(255,180,120,.28);
    box-shadow:0 10px 50px rgba(0,0,0,.55),0 0 44px rgba(255,160,90,.14);
    backdrop-filter:blur(18px) saturate(1.1);
    display:flex;align-items:center;gap:14px;padding:0 20px;
    opacity:0;transition:transform .45s cubic-bezier(.2,.9,.25,1),opacity .4s ease;
    -webkit-backdrop-filter:blur(18px) saturate(1.1);}
  #wakePanel.show{transform:translateX(-50%) translateY(0);opacity:1;}
  #miniWrap{width:108px;height:108px;flex:0 0 108px;border-radius:50%;position:relative;}
  #miniNebula{width:108px;height:108px;display:block;}
  /* “被包裹”的环 */
  #miniRing{position:absolute;inset:0;border-radius:50%;
    border:1.5px solid rgba(255,185,130,.35);
    box-shadow:0 0 22px rgba(255,160,90,.18),inset 0 0 18px rgba(255,160,90,.12);
    pointer-events:none;}
  #wakeInfo{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
  #wakeReply{font-size:17px;letter-spacing:2px;opacity:.94;}
  #wakeStatus{font-size:12px;opacity:.55;letter-spacing:1px;}
  #wakeTimer{width:100%;height:3px;border-radius:3px;background:rgba(255,200,160,.14);overflow:hidden;margin-top:4px;}
  #wakeTimerFill{height:100%;width:100%;background:linear-gradient(90deg,#ff8a3d,#ff9eb5);
    transform-origin:left;transition:none;}
  #wakeMic{font-size:11px;opacity:.45;letter-spacing:.5px;}
  #wakeMore{font-size:12px;opacity:.7;border:1px solid rgba(255,200,160,.25);
    border-radius:14px;padding:6px 12px;background:transparent;color:var(--ink);flex:0 0 auto;}
  #wakeMore.hold{font-size:13px;padding:9px 18px;background:rgba(255,150,90,.18);
    border-color:rgba(255,200,160,.5);opacity:.95;}

  /* 状态预览条(开发用)：单独停在某个状态看动效 */
  #devBar{position:fixed;top:calc(env(safe-area-inset-top,0) + 44px);left:0;right:0;
    display:flex;justify-content:center;gap:7px;z-index:6;opacity:.55;pointer-events:auto;}
  #devBar button{font-size:11px;letter-spacing:1px;padding:6px 11px;border-radius:14px;
    border:1px solid rgba(255,200,160,.22);background:rgba(30,18,10,.5);color:var(--ink);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
  #devBar button.on{background:rgba(255,150,90,.30);border-color:rgba(255,200,160,.55);opacity:1;}
</style>
</head>
<body>
  <canvas id="nebula"></canvas>

  <div id="statebar"><div id="stateText">待机</div></div>

  <button id="wakeFab">模拟<br>唤醒</button>

  <!-- 状态预览条(开发用)：点哪个就停在哪个状态 -->
  <div id="devBar">
    <button data-s="idle">待机</button>
    <button data-s="listening">聆听</button>
    <button data-s="thinking">思考</button>
    <button data-s="speaking">回应</button>
    <button data-s="wake">唤醒</button>
  </div>

  <div id="talkWrap">
    <button id="talkBtn">按住<br>说话</button>
    <div id="talkHint">点屏幕任意处可“戳”一下</div>
  </div>

  <!-- 场景B 悬浮生命体 -->
  <div id="wakePanel">
    <div id="miniWrap">
      <canvas id="miniNebula"></canvas>
      <div id="miniRing"></div>
    </div>
    <div id="wakeInfo">
      <div id="wakeReply">我在</div>
      <div id="wakeStatus">正在聆听…</div>
      <div id="wakeMic">麦克风模拟中</div>
      <div id="wakeTimer"><div id="wakeTimerFill"></div></div>
    </div>
    <button id="wakeMore">继续说</button>
  </div>

  <audio id="sndAi" src="wake_src/ai.m4a" preload="auto"></audio>
  <audio id="sndWo" src="wake_src/wo.mp3" preload="auto"></audio>

<script src="lifeform.js"></script>
<script>
(()=>{
  "use strict";
  const DPR = Math.min(window.devicePixelRatio||1, 2.5);

  // ================= 桥接服务配置（接真模型用） =================
  // BASE 留空 = 离线占位模式（用本地 ai.m4a/wo.mp3 + 硬编码文案）。
  // 填上地址即走真实调用。Evan 提供的桥：http://192.168.31.235:8788 （2026-08-12）
  // 没确认的项先按需求文档默认假设，联调报错再对应切换：
  //   AUTH           —— 暂留空（对端无鉴权）
  //   TRANSCRIBE_WAV —— false=发裸 16-bit/16k/mono PCM；若对端收 wav 容器改 true
  //   USE_STREAM     —— false=非流式 /v1/respond；若对端实现 respond_stream 改 true
  const BRIDGE = {
    BASE: 'http://192.168.31.235:8788',
    AUTH: '',                 // 若桥需鉴权填 'Bearer xxxxx'，否则留空
    TIMEOUT_MS: { transcribe: 15000, respond: 12000, speak: 12000, wake: 6000, health: 4000 },
    TRANSCRIBE_WAV: false,    // true=桥收 wav 容器；false=收裸 16-bit/16k/mono PCM
    USE_STREAM: false,        // true=用 /v1/respond_stream（若对端实现）
  };
  const USE_BRIDGE = !!BRIDGE.BASE;
  function bridgeURL(p){ return BRIDGE.BASE.replace(/\/+$/,'') + p; }
  async function bridgeFetch(path, opts){
    const headers = Object.assign({}, (opts && opts.headers) || {});
    if(BRIDGE.AUTH) headers['Authorization'] = BRIDGE.AUTH;
    const ctrl = new AbortController();
    const tid = setTimeout(()=>ctrl.abort(), (opts && opts.timeout) || 10000);
    try{
      const r = await fetch(bridgeURL(path), Object.assign({}, opts, { headers, signal: ctrl.signal }));
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r;
    } finally { clearTimeout(tid); }
  }

  // 会话：每设备一个 UUID，持久化在多轮记忆里
  let SESSION_ID = localStorage.getItem('cira_session_id');
  if(!SESSION_ID){
    SESSION_ID = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('sess_'+Date.now()+'_'+Math.random().toString(36).slice(2));
    try{ localStorage.setItem('cira_session_id', SESSION_ID); }catch(e){}
  }
  let bridgeReady = false;
  async function checkBridge(){
    if(!USE_BRIDGE) return false;
    try{
      const r = await bridgeFetch('/v1/health', { method:'GET', timeout: BRIDGE.TIMEOUT_MS.health });
      const j = await r.json();
      bridgeReady = !!(j && j.core_ready !== false);
    }catch(e){ bridgeReady = false; }
    return bridgeReady;
  }

  // ---- 音频：base64 → 播放 ----
  function b64ToArrayBuffer(b64){
    const bin = atob(b64); const len = bin.length;
    const ab = new ArrayBuffer(len); const u8 = new Uint8Array(ab);
    for(let i=0;i<len;i++) u8[i] = bin.charCodeAt(i);
    return ab;
  }
  function playAudio(base64, format){
    return new Promise(res=>{
      try{
        const ab = b64ToArrayBuffer(base64);
        const blob = new Blob([ab], { type: format==='mp3' ? 'audio/mpeg' : 'audio/wav' });
        const url = URL.createObjectURL(blob);
        const a = new Audio(url); a.preload = 'auto';
        a.onended = ()=>{ setTimeout(()=>URL.revokeObjectURL(url), 2000); res(true); };
        a.onerror = ()=>{ URL.revokeObjectURL(url); res(false); };
        a.play().catch(()=>{ URL.revokeObjectURL(url); res(false); });
      }catch(e){ res(false); }
    });
  }
  function webTTS(text){
    return new Promise(res=>{
      try{
        const u = new SpeechSynthesisUtterance(text || '');
        u.lang = 'zh-CN';
        u.onend = ()=>res(true); u.onerror = ()=>res(false);
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      }catch(e){ res(false); }
    });
  }

  // ---- 麦克风 PCM 采集（16-bit / 16k / 单声道） ----
  let audioCtx = null, scriptNode = null, micChunks = [];
  function resampleFloat(chunks, fromRate, toRate){
    let total = 0; for(const c of chunks) total += c.length;
    const all = new Float32Array(total); let off = 0;
    for(const c of chunks){ all.set(c, off); off += c.length; }
    if(fromRate === toRate || !fromRate) return all;
    const ratio = fromRate / toRate;
    const outLen = Math.floor(all.length / ratio);
    const out = new Float32Array(outLen);
    for(let i=0;i<outLen;i++){
      const idx = i*ratio, i0 = Math.floor(idx), frac = idx-i0, i1 = Math.min(i0+1, all.length-1);
      out[i] = all[i0]*(1-frac) + all[i1]*frac;
    }
    return out;
  }
  function floatToPCM16(f32){
    const out = new Int16Array(f32.length);
    for(let i=0;i<f32.length;i++){ let s = Math.max(-1, Math.min(1, f32[i])); out[i] = s<0 ? s*0x8000 : s*0x7FFF; }
    return out;
  }
  function makeWavBlob(pcmInt16){
    const sr = 16000, dataSize = pcmInt16.byteLength;
    const buf = new ArrayBuffer(44 + dataSize); const dv = new DataView(buf);
    const ws = (o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i, s.charCodeAt(i)); };
    ws(0,'RIFF'); dv.setUint32(4, 36+dataSize, true); ws(8,'WAVE'); ws(12,'fmt ');
    dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
    dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
    ws(36,'data'); dv.setUint32(40,dataSize,true);
    new Uint8Array(buf,44).set(new Uint8Array(pcmInt16.buffer));
    return new Blob([buf], { type:'audio/wav' });
  }
  function flushPCM(){
    const f32 = resampleFloat(micChunks, audioCtx ? audioCtx.sampleRate : 48000, 16000);
    micChunks = [];
    const pcm = floatToPCM16(f32);
    return BRIDGE.TRANSCRIBE_WAV ? makeWavBlob(pcm) : new Blob([pcm.buffer], { type:'application/octet-stream' });
  }

  // ---- ASR 不可用时的文字输入降级 ----
  function askTextFallback(){
    return new Promise(res=>{
      let inp = document.getElementById('wakeText');
      if(!inp){
        inp = document.createElement('input');
        inp.id = 'wakeText'; inp.placeholder = '语音没识别出来，打字也行…';
        inp.style.cssText = 'position:absolute;left:12px;right:12px;bottom:54px;padding:10px 12px;border-radius:10px;border:1px solid #ff9eb5;background:#1a1020;color:#fff;font-size:15px;';
        wakePanel.appendChild(inp);
      }
      inp.style.display = 'block'; inp.value = ''; inp.focus();
      const done = ()=>{ inp.style.display='none'; inp.removeEventListener('keydown', onKey); res(inp.value.trim() || null); };
      const onKey = (e)=>{ if(e.key === 'Enter') done(); };
      inp.addEventListener('keydown', onKey);
    });
  }

  // ---------- 光生命体引擎 (与 v0.7 同款) ----------
  const nebula = document.getElementById('nebula');
  const mini   = document.getElementById('miniNebula');
  const lf     = new LightLifeform(nebula, { fullscreen:true });
  const miniLf = new LightLifeform(mini);   // 场景B：圆内小星云
  miniLf.setEmotion('comfort');
  lf.setDensity(1.45);     // 更密的星云
  miniLf.setDensity(1.25);

  // ---------- 状态机 ----------
  const STATE = { IDLE:'idle', LISTEN:'listening', THINK:'thinking', SPEAK:'speaking', WAKE:'wake' };
  let state = STATE.IDLE;
  let stateUntil = 0;
  let talkT1 = null, talkT2 = null;   // 按住说话自动流转的定时器(供预览条清除)
  const stateText = document.getElementById('stateText');
  const label = { idle:'待机', listening:'聆听', thinking:'思考', speaking:'回应', wake:'唤醒' };
  const emotionOf = { idle:'calm', listening:'curious', thinking:'thinking', speaking:'happy', wake:'comfort' };
  function setState(s, holdMs){
    state = s; stateText.textContent = label[s]||s;
    lf.setState(s);
    miniLf.setState(s);
    if(emotionOf[s]){ lf.setEmotion(emotionOf[s]); miniLf.setEmotion(emotionOf[s]); }
    if(holdMs) stateUntil = performance.now()+holdMs;
  }

  // ---------- 触碰引力：星云被手指吸引，朝落点汇聚 ----------
  // 按下=由近及远缓慢吸引(逐粒缓动汇入)；移动=引力点跟随；松手=缓慢落回原轨道(环绕星群)
  let touching = false;
  function touchXY(e){ return { x: e.clientX, y: e.clientY }; }

  nebula.addEventListener('pointerdown', e=>{
    touching = true;
    const p = touchXY(e);
    lf.setAttractor(p.x, p.y);
  });
  nebula.addEventListener('pointermove', e=>{
    if(!touching) return;
    const p = touchXY(e);
    lf.setAttractor(p.x, p.y);   // 引力点随手指移动
  });
  function endTouch(){ if(touching){ touching = false; lf.clearAttractor(); } }
  nebula.addEventListener('pointerup', endTouch);
  nebula.addEventListener('pointercancel', endTouch);
  nebula.addEventListener('pointerleave', endTouch);

  // ---------- 按住说话 ----------
  const talkBtn=document.getElementById('talkBtn');
  function startTalk(){
    if(wakeActive) return;
    setState(STATE.LISTEN);
    lf.setAudioLevel(0.7);
    talkBtn.classList.add('listening');
    talkBtn.innerHTML='聆听<br>中…';
  }
  function endTalk(){
    talkBtn.classList.remove('listening');
    talkBtn.innerHTML='按住<br>说话';
    lf.setAudioLevel(0.3);
    if(state===STATE.LISTEN){
      setState(STATE.THINK, 1000);
      talkT1 = setTimeout(()=>{ if(state===STATE.THINK) setState(STATE.SPEAK, 1800); }, 1000);
      talkT2 = setTimeout(()=>{ if(state===STATE.SPEAK) setState(STATE.IDLE); }, 1000+1800);
    }
  }
  talkBtn.addEventListener('pointerdown', e=>{e.preventDefault(); startTalk();});
  talkBtn.addEventListener('pointerup', endTalk);
  talkBtn.addEventListener('pointercancel', endTalk);
  talkBtn.addEventListener('pointerleave', e=>{ if(state===STATE.LISTEN) endTalk(); });

  // ---------- 场景B 模拟唤醒 + 麦克风 VAD(能量阈值) ----------
  // 注：此原型未接入真实模型。唤醒/回话/思考/回应均为本地模拟，
  // 仅用麦克风音量模拟"是否有人说话"，验证"说一句才进思考、不说静静等"的流转手感。
  const wakePanel=document.getElementById('wakePanel');
  const wakeFill=document.getElementById('wakeTimerFill');
  const wakeReply=document.getElementById('wakeReply');
  const wakeStatus=document.getElementById('wakeStatus');
  const wakeMic=document.getElementById('wakeMic');
  const wakeMore=document.getElementById('wakeMore');
  const sndAi=document.getElementById('sndAi');
  const sndWo=document.getElementById('sndWo');

  let wakeActive=false;                 // 悬浮是否激活(替代旧的 state===WAKE 判断)
  let micStream=null, analyser=null, micData=null, vadRAF=null;
  let vadLevel=0;                       // 当前音量 0..1(驱动 VAD)
  let usingRealMic=false, fallbackBound=false;
  let speaking=false, heardAny=false;   // 本轮回合：是否在收录中 / 是否曾检测到人声
  let silentStart=0;                    // 最近一次静默起点(用于句尾判定)
  let wakeTick=null;
  let wakePhase='listen';               // listen / think / speak
  let wakeStart=0;                       // 本轮唤醒起始时刻(初始静默超时基准)

  const VAD_THRESHOLD = 0.06;           // 归一化 RMS 阈值(有无人声)
  const SILENCE_MS    = 1800;           // 句尾静默判定(说完后静默多久算一句说完)
  const INIT_SILENCE  = 6000;           // 初始静默超时(唤醒后一直无人开口才退出)
  const REPLY_PHRASES = ['我在听呢','你想说什么？','嗯，我明白','好的，接着说'];

  function startMic(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ fallbackMic(); return; }
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(stream=>{
      micStream=stream; usingRealMic=true;
      const AC=window.AudioContext||window.webkitAudioContext;
      audioCtx=new AC();
      if(audioCtx.state==='suspended') audioCtx.resume();
      const src=audioCtx.createMediaStreamSource(stream);
      const silentGain=audioCtx.createGain(); silentGain.gain.value=0;   // 静音，避免麦克风回放
      scriptNode=audioCtx.createScriptProcessor(4096,1,1);
      micChunks=[];
      scriptNode.onaudioprocess=(e)=>{
        const ch=e.inputBuffer.getChannelData(0);
        micChunks.push(new Float32Array(ch));          // 累积原始采样，句尾送 ASR
        let sum=0; for(let i=0;i<ch.length;i++){ const v=ch[i]; sum+=v*v; }
        vadLevel=Math.min(1, Math.sqrt(sum/ch.length)*3.2);   // VAD 能量
        lf.setAudioLevel(0.3 + vadLevel*0.7);
      };
      src.connect(scriptNode); scriptNode.connect(silentGain); silentGain.connect(audioCtx.destination);
      wakeMic.textContent='麦克风已开启 · 说话试试';
    }).catch(()=>{ fallbackMic(); });
  }
  // 降级：局域网 http 通常不是安全上下文，getUserMedia 拿不到权限 → 用"按住说话"模拟
  function fallbackMic(){
    usingRealMic=false; wakeMic.textContent='未授权麦克风 · 请“按住说话”';
    wakeMore.textContent='按住说话'; wakeMore.classList.add('hold');
    if(!fallbackBound){
      fallbackBound=true;
      wakeMore.addEventListener('pointerdown', e=>{ e.preventDefault(); vadLevel=0.9; });
      const release=()=>{ vadLevel=0; };
      wakeMore.addEventListener('pointerup', release);
      wakeMore.addEventListener('pointercancel', release);
      wakeMore.addEventListener('pointerleave', release);
    }
  }
  function keepListening(){            // 真实麦模式：点"继续说"续命(重置初始静默)
    if(!wakeActive) return;
    startWakeTick();
    wakeStatus.textContent='继续聆听…';
  }

  function triggerWake(){
    if(wakeActive){ keepListening(); return; }
    wakeActive=true;
    setState(STATE.LISTEN);            // 唤醒即进入聆听子状态
    wakePanel.classList.add('show');
    speaking=false; heardAny=false; wakePhase='listen';
    const which = Math.random()<0.5 ? 'ai' : 'wo';
    wakeReply.textContent = which==='ai' ? '哎' : '我在';
    wakeStatus.textContent='正在聆听…';
    // 唤醒应答音频：优先桥，失败用本地
    if(USE_BRIDGE){
      bridgeFetch('/v1/wake_ack?which='+which, { method:'GET', timeout: BRIDGE.TIMEOUT_MS.wake })
        .then(r=>r.json()).then(j=>{ if(j && j.audio) playAudio(j.audio, j.format||'mp3'); })
        .catch(()=>{ const a=which==='ai'?sndAi:sndWo; a.currentTime=0; a.play().catch(()=>{}); });
    }else{
      const a=which==='ai'?sndAi:sndWo; a.currentTime=0; a.play().catch(()=>{});
    }
    startMic();
    startWakeTick();
  }
  function startWakeTick(){
    if(wakeTick) clearInterval(wakeTick);
    wakeStart=performance.now(); silentStart=wakeStart;
    wakeTick=setInterval(()=>{
      const now=performance.now();
      const active=vadLevel>VAD_THRESHOLD;
      if(active){
        heardAny=true; speaking=true; silentStart=now;
        if(wakePhase==='listen') wakeStatus.textContent='我在听…';
      } else if(speaking && now-silentStart>SILENCE_MS){
        endSentence(); return;        // 句尾→思考/回应
      }
      // 进度条：有人声=涨满；静默=按剩余静默预算回落；没人开口过=按初始预算
      const budget=heardAny?SILENCE_MS:INIT_SILENCE;
      const el=heardAny?(now-silentStart):(now-wakeStart);
      wakeFill.style.transform=`scaleX(${Math.max(0,1-el/budget)})`;
      if(!heardAny && now-wakeStart>INIT_SILENCE) hideWake();
    },60);
  }
  async function endSentence(){
    speaking=false; wakePhase='think';
    if(wakeTick){ clearInterval(wakeTick); wakeTick=null; }
    setState(STATE.THINK); wakeStatus.textContent='思考中…';

    let text=null;
    if(usingRealMic){
      if(USE_BRIDGE){                       // 真实麦克风 → ASR
        try{
          const pcmBlob = flushPCM();
          const r = await bridgeFetch('/v1/transcribe', { method:'POST', body:pcmBlob,
            headers:{'Content-Type': BRIDGE.TRANSCRIBE_WAV?'audio/wav':'application/octet-stream'},
            timeout: BRIDGE.TIMEOUT_MS.transcribe });
          const j = await r.json();
          if(j && j.asr_available && j.text) text = j.text;
        }catch(e){ console.warn('[CIRA] transcribe fail', e); }
      }
    } else if(USE_BRIDGE){                   // 麦克风不可用（非安全上下文）→ 文字降级
      text = await askTextFallback();
    }

    if(!USE_BRIDGE){                          // 离线占位：不联网
      wakePhase='speak'; setState(STATE.SPEAK);
      wakeReply.textContent=REPLY_PHRASES[Math.floor(Math.random()*REPLY_PHRASES.length)];
      wakeStatus.textContent='回应中…(模型未接入)';
      setTimeout(backToListen, 1800);
      return;
    }
    if(!text){ backToListen(); return; }      // 没拿到文字（ASR 空且用户取消输入）

    // Core 回应：emotion/ignite 取桥的 display_state（权威），status 由 App 自管
    let emotion='comfort', ignite=null;
    try{
      const r = await bridgeFetch('/v1/respond', { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ schema:'child-input@1', text, speaker:'child', child_age:0,
          channel:'voice', history:'', voice_meta:null, session_id:SESSION_ID }),
        timeout: BRIDGE.TIMEOUT_MS.respond });
      const j = await r.json();
      const ds = j && j.display_state;
      if(ds){ if(ds.emotion) emotion=ds.emotion; if('ignite' in ds) ignite=ds.ignite; }
      else if(j && j.emotion) emotion=j.emotion;
    }catch(e){ console.warn('[CIRA] respond fail', e); }
    lf.setEmotion(emotion); miniLf.setEmotion(emotion);
    if(ignite){ lf.pulse(); miniLf.pulse(); }   // Core 标记 ignite：炸开式点亮（display_state.ignite 非空时）

    // TTS 播放
    wakePhase='speak'; setState(STATE.SPEAK);
    wakeReply.textContent=text;
    let ok=false;
    try{
      const r = await bridgeFetch('/v1/speak', { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ schema:'response-package@1', text, emotion }),
        timeout: BRIDGE.TIMEOUT_MS.speak });
      const j = await r.json();
      if(j && j.audio) ok = await playAudio(j.audio, j.format||'wav');
      else if(j && j.fallback==='web_tts') ok = await webTTS(text);
    }catch(e){ console.warn('[CIRA] speak fail', e); }
    if(!ok) await webTTS(text || '我刚才走神了');
    backToListen();
  }
  function backToListen(){
    wakePhase='listen'; speaking=false; heardAny=false;
    setState(STATE.LISTEN); wakeStatus.textContent='继续聆听…';
    startWakeTick();
  }
  function hideWake(){
    wakeActive=false;
    if(wakeTick){ clearInterval(wakeTick); wakeTick=null; }
    if(vadRAF){ cancelAnimationFrame(vadRAF); vadRAF=null; }
    if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
    wakePanel.classList.remove('show');
    setState(STATE.IDLE);
  }
  document.getElementById('wakeFab').addEventListener('click', triggerWake);
  document.getElementById('wakeMore').addEventListener('click', ()=>{
    if(usingRealMic) keepListening();   // 真实麦：点"继续说"续命
    // 降级模式：wakeMore 已绑定为"按住说话"，click 忽略
  });

  // ---------- 状态预览条(开发用)：点哪个停在哪个，不被说话流转覆盖 ----------
  const devBar = document.getElementById('devBar');
  const devBtns = devBar.querySelectorAll('button');
  function previewState(s){
    if(talkT1){ clearTimeout(talkT1); talkT1=null; }
    if(talkT2){ clearTimeout(talkT2); talkT2=null; }
    if(s===STATE.WAKE) triggerWake();
    else setState(s);
    devBtns.forEach(b=> b.classList.toggle('on', b.dataset.s===s));
  }
  devBtns.forEach(b=> b.addEventListener('click', ()=> previewState(b.dataset.s)));

  // 启动自检：桥是否可达
  checkBridge().then(ok=>{ if(USE_BRIDGE) console.log('[CIRA] 桥接服务', ok?'就绪':'不可达(离线降级)'); });

  document.addEventListener('gesturestart', e=>e.preventDefault());
})();
</script>
