<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CIRA · 安卓原型</title>
<style>
  :root{
    --accent:#5fe3ff;
    --accent2:#a98bff;
    --ink:#eaf6ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060a;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;
    color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;}
  #nebula{position:fixed;inset:0;width:100%;height:100%;display:block;}

  /* 顶部状态条 */
  #statebar{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;
    display:flex;justify-content:center;padding:14px 0 6px;z-index:5;pointer-events:none;}
  #stateText{font-size:13px;letter-spacing:3px;opacity:.55;
    text-shadow:0 0 12px rgba(95,227,255,.4);}

  /* 底部按住说话 */
  #talkWrap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0) + 26px);
    display:flex;flex-direction:column;align-items:center;gap:10px;z-index:6;}
  #talkBtn{width:96px;height:96px;border-radius:50%;border:none;
    background:radial-gradient(circle at 35% 30%,#1b3a52,#0a1622);
    box-shadow:0 0 0 2px rgba(95,227,255,.35),0 8px 30px rgba(0,0,0,.5),
      inset 0 0 24px rgba(95,227,255,.25);
    color:var(--ink);font-size:14px;letter-spacing:2px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease, box-shadow .2s ease;will-change:transform;}
  #talkBtn:active{transform:scale(.9);
    box-shadow:0 0 0 6px rgba(95,227,255,.5),0 0 40px rgba(95,227,255,.5),
      inset 0 0 30px rgba(95,227,255,.5);}
  #talkBtn.listening{animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(95,227,255,.4),0 0 26px rgba(95,227,255,.3);}
    50%{box-shadow:0 0 0 8px rgba(95,227,255,.55),0 0 48px rgba(95,227,255,.6);}}
  #talkHint{font-size:12px;opacity:.4;letter-spacing:1px;}

  /* 模拟唤醒 FAB（开发用，真机由唤醒词触发） */
  #wakeFab{position:fixed;top:calc(env(safe-area-inset-top,0) + 12px);right:14px;
    z-index:7;width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
    background:rgba(15,20,30,.6);color:var(--ink);font-size:11px;line-height:1.2;
    backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;}

  /* 场景B：底部半透明悬浮生命体 */
  #wakePanel{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);
    bottom:calc(env(safe-area-inset-bottom,0) + 18px);
    width:min(86vw,420px);height:148px;border-radius:30px;z-index:8;
    background:linear-gradient(180deg,rgba(20,26,40,.42),rgba(8,12,22,.55));
    border:1px solid rgba(120,200,255,.22);
    box-shadow:0 10px 50px rgba(0,0,0,.5),0 0 40px rgba(95,227,255,.12);
    backdrop-filter:blur(18px) saturate(1.1);
    display:flex;align-items:center;gap:14px;padding:0 20px;
    opacity:0;transition:transform .45s cubic-bezier(.2,.9,.25,1),opacity .4s ease;
    -webkit-backdrop-filter:blur(18px) saturate(1.1);}
  #wakePanel.show{transform:translateX(-50%) translateY(0);opacity:1;}
  #miniNebula{width:108px;height:108px;flex:0 0 108px;border-radius:50%;display:block;}
  #wakeInfo{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
  #wakeReply{font-size:17px;letter-spacing:2px;opacity:.92;}
  #wakeStatus{font-size:12px;opacity:.5;letter-spacing:1px;}
  #wakeTimer{width:100%;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:4px;}
  #wakeTimerFill{height:100%;width:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
    transform-origin:left;transition:none;}
  #wakeMore{font-size:12px;opacity:.6;border:1px solid rgba(255,255,255,.2);
    border-radius:14px;padding:6px 12px;background:transparent;color:var(--ink);flex:0 0 auto;}
</style>
</head>
<body>
  <canvas id="nebula"></canvas>

  <div id="statebar"><div id="stateText">待机</div></div>

  <button id="wakeFab">模拟<br>唤醒</button>

  <div id="talkWrap">
    <button id="talkBtn">按住<br>说话</button>
    <div id="talkHint">点屏幕任意处可“戳”一下</div>
  </div>

  <!-- 场景B 悬浮生命体 -->
  <div id="wakePanel">
    <canvas id="miniNebula"></canvas>
    <div id="wakeInfo">
      <div id="wakeReply">我在</div>
      <div id="wakeStatus">正在聆听…</div>
      <div id="wakeTimer"><div id="wakeTimerFill"></div></div>
    </div>
    <button id="wakeMore">继续说</button>
  </div>

  <audio id="sndAi" src="wake_src/ai.m4a" preload="auto"></audio>
  <audio id="sndWo" src="wake_src/wo.mp3" preload="auto"></audio>

<script>
(()=>{
  "use strict";
  const cv = document.getElementById('nebula');
  const ctx = cv.getContext('2d');
  const mini = document.getElementById('miniNebula');
  const mctx = mini.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio||1, 2.5);

  let W=0,H=0,CX=0,CY=0,R=0;
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    CX = W/2; CY = H/2; R = Math.min(W,H)*0.42;
    const ms = 108;
    mini.width = ms*DPR; mini.height = ms*DPR;
    mini.style.width=ms+'px'; mini.style.height=ms+'px';
    mctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize); resize();

  // ---------- 状态机 ----------
  const STATE = { IDLE:'idle', LISTEN:'listening', THINK:'thinking', SPEAK:'speaking', WAKE:'wake' };
  let state = STATE.IDLE;
  let stateUntil = 0;            // 自动回到 idle 的时间戳
  const stateText = document.getElementById('stateText');
  const label = { idle:'待机', listening:'聆听', thinking:'思考', speaking:'回应', wake:'唤醒' };
  function setState(s, holdMs){
    state = s; stateText.textContent = label[s]||s;
    if(holdMs) stateUntil = performance.now()+holdMs;
  }

  // ---------- 星云粒子 ----------
  const N = Math.round(Math.min(260, (W*H)/9000));
  const parts = [];
  const PAL = ['#5fe3ff','#7fb6ff','#a98bff','#b6f0ff','#c8a8ff'];
  for(let i=0;i<N;i++){
    const a = Math.random()*Math.PI*2;
    const rad = Math.pow(Math.random(),0.6)*R;
    parts.push({
      a, rad, base:rad,
      sz: 1+Math.random()*2.4,
      sp: (0.15+Math.random()*0.5)*(Math.random()<.5?-1:1),
      col: PAL[(Math.random()*PAL.length)|0],
      ph: Math.random()*Math.PI*2,
      wob: 0.4+Math.random()*0.8
    });
  }

  // ---------- 触碰“戳” ----------
  const pokes = [];          // 涟漪
  let pokeBounce = 0;        // 整体弹性缩放冲量
  let lookX = CX, lookY = CY;        // 星云“看向”的点（被戳后偏移，回弹）
  let lookTX = CX, lookTY = CY;
  let lastPoke = 0;

  function doPoke(x,y){
    pokes.push({x,y,t:performance.now(),life:900});
    pokeBounce = Math.min(pokeBounce+0.18, 0.5);
    lookTX = x; lookTY = y; lastPoke = performance.now();
    // 在戳点爆一小簇亮粒
    for(let k=0;k<10;k++){
      const ang = Math.random()*Math.PI*2, d = Math.random()*26;
      parts.push({a:Math.random()*6.28, rad:R*0.05, base:R*0.05, sz:2+Math.random()*2.5,
        sp:0, col:'#ffffff', ph:0, wob:1, burst:true, bx:x, by:y,
        vx:Math.cos(ang)*d, vy:Math.sin(ang)*d, bt:performance.now()});
    }
  }
  cv.addEventListener('pointerdown', e=>{
    if(e.target!==cv) return;
    doPoke(e.clientX, e.clientY);
  });

  // ---------- 渲染 ----------
  let t0 = performance.now();
  function draw(now){
    const dt = Math.min(40, now-t0); t0 = now;
    const tt = now/1000;

    // 状态自动回退
    if(state!==STATE.WAKE && stateUntil && now>stateUntil){
      setState(STATE.IDLE); stateUntil=0;
    }

    // 背景（带轻微拖影形成“流动”）
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(5,6,10,0.30)';
    ctx.fillRect(0,0,W,H);

    // 弹性缩放 & 看向回弹
    pokeBounce *= 0.90; if(pokeBounce<0.005) pokeBounce=0;
    lookX += (lookTX-lookX)*0.06; lookY += (lookTY-lookY)*0.06;
    if(now-lastPoke>700){ lookTX=CX; lookTY=CY; }
    const scale = 1 + pokeBounce*0.12 + Math.sin(tt*0.8)*0.012;
    const cxp = (lookX+CX)/2, cyp=(lookY+CY)/2;

    // 活跃度（按状态）
    let activity = 0.4;
    if(state===STATE.LISTEN) activity=1.0;
    else if(state===STATE.THINK) activity=0.75;
    else if(state===STATE.SPEAK) activity=0.95;
    else if(state===STATE.WAKE) activity=0.6;

    ctx.globalCompositeOperation='lighter';
    for(const p of parts){
      if(p.burst){
        const age=(now-p.bt)/420;
        if(age>=1){ p.dead=true; continue; }
        const x=p.bx+p.vx*age, y=p.by+p.vy*age;
        const al=(1-age);
        ctx.fillStyle=`rgba(255,255,255,${al})`;
        ctx.beginPath(); ctx.arc(x,y,p.sz*(1-age*0.5),0,6.28); ctx.fill();
        continue;
      }
      p.a += p.sp*dt*0.001*(0.6+activity);
      const breathe = 1 + Math.sin(tt*0.9+p.ph)*0.05*(0.5+activity);
      const rad = p.base*breathe*scale + Math.sin(tt*1.3*p.wob+p.ph)*4*activity;
      const x = cxp + Math.cos(p.a)*rad;
      const y = cyp + Math.sin(p.a)*rad*0.92;
      const grad = ctx.createRadialGradient(x,y,0,x,y,p.sz*4);
      grad.addColorStop(0, p.col);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.globalAlpha = 0.5+activity*0.4;
      ctx.beginPath(); ctx.arc(x,y,p.sz*4,0,6.28); ctx.fill();
    }
    ctx.globalAlpha=1;
    // 清理死亡爆粒
    for(let i=parts.length-1;i>=0;i--) if(parts[i].dead) parts.splice(i,1);

    // 中心核
    const coreR = (R*0.16)*scale*(1+Math.sin(tt*1.6)*0.05);
    const core = ctx.createRadialGradient(cxp,cyp,0,cxp,cyp,coreR*2.4);
    core.addColorStop(0,'rgba(220,245,255,.95)');
    core.addColorStop(0.3,'rgba(120,200,255,.5)');
    core.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=core;
    ctx.beginPath(); ctx.arc(cxp,cyp,coreR*2.4,0,6.28); ctx.fill();

    // 状态相关：声波环
    if(state===STATE.LISTEN || state===STATE.SPEAK){
      for(let r=0;r<3;r++){
        const phase=(tt*1.4 + r*0.4)%1;
        const rr=coreR + phase*(R*0.55);
        ctx.strokeStyle=`rgba(95,227,255,${(1-phase)*0.5*(state===STATE.SPEAK?0.8:1)})`;
        ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(cxp,cyp,rr,0,6.28); ctx.stroke();
      }
    }
    if(state===STATE.THINK){
      ctx.strokeStyle='rgba(169,139,255,.4)'; ctx.lineWidth=2;
      for(let r=0;r<2;r++){
        const phase=(tt*0.8+r*0.5)%1;
        ctx.beginPath(); ctx.arc(cxp,cyp,coreR+phase*R*0.4,0,6.28); ctx.stroke();
      }
    }

    // 涟漪（戳）
    ctx.globalCompositeOperation='lighter';
    for(let i=pokes.length-1;i>=0;i--){
      const pk=pokes[i]; const age=(now-pk.t)/pk.life;
      if(age>=1){ pokes.splice(i,1); continue; }
      const rr=age*R*0.5;
      ctx.strokeStyle=`rgba(182,240,255,${(1-age)*0.8})`;
      ctx.lineWidth=3*(1-age)+0.5;
      ctx.beginPath(); ctx.arc(pk.x,pk.y,rr,0,6.28); ctx.stroke();
      // 中心点一下闪
      if(age<0.3){
        ctx.fillStyle=`rgba(255,255,255,${(0.3-age)*3})`;
        ctx.beginPath(); ctx.arc(pk.x,pk.y,6,0,6.28); ctx.fill();
      }
    }
    ctx.globalCompositeOperation='source-over';

    drawMini(now, activity);
    requestAnimationFrame(draw);
  }

  // ---------- 场景B：底部小星云 ----------
  let miniPhase=0;
  function drawMini(now, activity){
    const w=108,h=108,mx=w/2,my=h/2;
    mctx.clearRect(0,0,w,h);
    // “被包裹”的环形边界
    mctx.strokeStyle='rgba(120,200,255,.35)'; mctx.lineWidth=2;
    mctx.beginPath(); mctx.arc(mx,my,46,0,6.28); mctx.stroke();
    // 内部小生命体
    const tt=now/1000; miniPhase=tt;
    const spin = state===STATE.WAKE? tt*1.6 : tt*0.5;
    mctx.globalCompositeOperation='lighter';
    for(let i=0;i<26;i++){
      const a=spin + i/26*6.28;
      const rad=18+Math.sin(tt*1.5+i)*6;
      const x=mx+Math.cos(a)*rad, y=my+Math.sin(a)*rad;
      const g=mctx.createRadialGradient(x,y,0,x,y,7);
      g.addColorStop(0,'#bff0ff'); g.addColorStop(1,'rgba(0,0,0,0)');
      mctx.fillStyle=g; mctx.beginPath(); mctx.arc(x,y,7,0,6.28); mctx.fill();
    }
    mctx.globalCompositeOperation='source-over';
    // 核
    const cg=mctx.createRadialGradient(mx,my,0,mx,my,16);
    cg.addColorStop(0,'rgba(230,248,255,.95)'); cg.addColorStop(1,'rgba(0,0,0,0)');
    mctx.fillStyle=cg; mctx.beginPath(); mctx.arc(mx,my,16,0,6.28); mctx.fill();
  }

  requestAnimationFrame(draw);

  // ---------- 按住说话 ----------
  const talkBtn=document.getElementById('talkBtn');
  let talkTimer=null;
  function startTalk(){
    if(state===STATE.WAKE) return;
    setState(STATE.LISTEN);
    talkBtn.classList.add('listening');
    talkBtn.innerHTML='聆听<br>中…';
  }
  function endTalk(){
    talkBtn.classList.remove('listening');
    talkBtn.innerHTML='按住<br>说话';
    if(state===STATE.LISTEN){
      setState(STATE.THINK, 1000);
      setTimeout(()=>{ if(state===STATE.THINK) setState(STATE.SPEAK, 1800); }, 1000);
      setTimeout(()=>{ if(state===STATE.SPEAK) setState(STATE.IDLE); }, 1000+1800);
    }
  }
  talkBtn.addEventListener('pointerdown', e=>{e.preventDefault(); startTalk();});
  talkBtn.addEventListener('pointerup', endTalk);
  talkBtn.addEventListener('pointercancel', endTalk);
  talkBtn.addEventListener('pointerleave', e=>{ if(state===STATE.LISTEN) endTalk(); });

  // ---------- 场景B 模拟唤醒 ----------
  const wakePanel=document.getElementById('wakePanel');
  const wakeFill=document.getElementById('wakeTimerFill');
  const wakeReply=document.getElementById('wakeReply');
  const wakeStatus=document.getElementById('wakeStatus');
  const sndAi=document.getElementById('sndAi');
  const sndWo=document.getElementById('sndWo');
  let wakeTimeout=null, wakeLeft=0, wakeStart=0;
  const WAKE_MS=10000;

  function triggerWake(){
    setState(STATE.WAKE);
    wakePanel.classList.add('show');
    // 随机回「哎」或「我在」
    const useAi = Math.random()<0.5;
    wakeReply.textContent = useAi? '哎' : '我在';
    (useAi?sndAi:sndWo).currentTime=0;
    (useAi?sndAi:sndWo).play().catch(()=>{});
    wakeStatus.textContent='正在聆听…';
    resetWakeTimer();
  }
  function resetWakeTimer(){
    wakeStart=performance.now(); wakeLeft=WAKE_MS;
    if(wakeTimeout) clearInterval(wakeTimeout);
    wakeTimeout=setInterval(()=>{
      const left=WAKE_MS-(performance.now()-wakeStart);
      const f=Math.max(0,left/WAKE_MS);
      wakeFill.style.transform=`scaleX(${f})`;
      if(left<=0){
        clearInterval(wakeTimeout); wakeTimeout=null;
        hideWake();
      }
    },80);
  }
  function hideWake(){
    wakePanel.classList.remove('show');
    if(state===STATE.WAKE) setState(STATE.IDLE);
  }
  document.getElementById('wakeFab').addEventListener('click', triggerWake);
  document.getElementById('wakeMore').addEventListener('click', ()=>{
    if(state===STATE.WAKE){ wakeStatus.textContent='继续聆听…'; resetWakeTimer(); }
  });

  // 防止双击缩放
  document.addEventListener('gesturestart', e=>e.preventDefault());
})();
</script>
</body>
</html>
