apply plugin: 'com.android.application'

android {
    namespace = "com.cira.runtime"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.cira.runtime"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.0.6"
        // —— 编译期配置（请填入你的真实值，或运行时用 setConfig 设置 Core 地址）——
        // CIRA Core 地址（本机 8787 / 局域网 / 云端）。例："http://192.168.31.235:8787"
        buildConfigField "String", "CIRA_CORE_URL", "\"https://evanmacbook-pro.taild2d78c.ts.net\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 只保留 ARM 架构（排除 x86/x86_64 可减小 ~50MB APK 体积）
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // 禁止 aapt 压缩资产文件（安全默认值，Web 资源本身已压缩不受影响）
            noCompress ''
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // APK 输出命名：cira-v{versionName}-{buildType}.apk
    applicationVariants.configureEach { variant ->
        variant.outputs.all { output ->
            outputFileName = "cira-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // 离线唤醒词引擎（Sherpa-ONNX KWS）。完全开源，无需注册。
    implementation files('libs/sherpa-onnx-1.13.5.aar')
    // Apache Commons Compress：解压 tar.bz2 模型包
    implementation 'org.apache.commons:commons-compress:1.26.1'
    // XZ for bz2 decompression (commons-compress 需要)
    implementation 'org.tukaani:xz:1.9'
    // 离线语音识别已改用 Sherpa-ONNX（同 sherpa-onnx AAR），Vosk 已移除
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// 构建前自动合并 ASR 模型（part1 + part2 → sherpa-asr.tar.bz2）
// GitHub 单文件 100MB 限制，git 保留拆分文件；APK assets 用合并后单文件
task mergeAsrModel {
    def assetsDir = file('src/main/assets/models')
    def part1 = new File(assetsDir, 'sherpa-asr-part1.tar.bz2')
    def part2 = new File(assetsDir, 'sherpa-asr-part2.tar.bz2')
    def merged = new File(assetsDir, 'sherpa-asr.tar.bz2')

    inputs.files(part1, part2)
    outputs.file(merged)

    doLast {
        if (!part1.exists() || !part2.exists()) {
            throw new GradleException("ASR model parts not found: part1=${part1.exists()}, part2=${part2.exists()}")
        }
        logger.lifecycle("Merging ASR model: part1 + part2 → sherpa-asr.tar.bz2")
        merged.bytes = part1.bytes + part2.bytes
        logger.lifecycle("Merged ASR model: ${merged.length()} bytes")
    }
}

tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn mergeAsrModel
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
